<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Spotify</title>
    <link rel="stylesheet" href="style.css">
    </head>
    <script src="script.js"></script>
    <body>

    <header>
        <h1>Spotify</h1>
    </header>

     <main>
        <section class="login">

        <h2>Entrar no Spotify</h2>

        <form id="formulario-login">

            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
                autocomplete="off"
                required
            >

            <label for="senha">Senha demonstrativa</label>
            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Digite uma senha"
                autocomplete="off"
                required
            >

            <button type="submit">Simular entrada</button>

        </form>
        <p id="resultado" role="status" aria-live="polite"></p>

       

            </section>
        </main>

</body>
</html>
